<!doctype html>
<html lang="de">
<head>
<title>Muda-Aufnahme Montage</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B6E66">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Muda">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: sticky Reiterleiste oben, darunter Arbeitsbereich; Aufnahme = Kartenraster aller Arbeitsplätze (3×2 auf Tablet quer) */
:root{
  --bg:#ECEFEC; --panel:#FFFFFF; --panel2:#F5F7F5; --ink:#18201D; --muted:#5D6762; --line:#D2D8D4;
  --accent:#0B6E66; --accent-ink:#FFFFFF; --accent-soft:#DDEFEC;
  --waste:#C25F16; --waste-soft:#FBE9DA; --danger:#B3261E; --danger-soft:#F8E1DF; --ok:#2E7D32; --warn:#B8860B;
  --f-disp:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111614; --panel:#1A201E; --panel2:#151a18; --ink:#E4E9E6; --muted:#97A29D; --line:#2B3330;
  --accent:#3DB0A3; --accent-ink:#0B1513; --accent-soft:#163430;
  --waste:#EE9450; --waste-soft:#3A2516; --danger:#F07167; --danger-soft:#3B1A18; --ok:#6CC070; --warn:#E0B54A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111614; --panel:#1A201E; --panel2:#151a18; --ink:#E4E9E6; --muted:#97A29D; --line:#2B3330;
  --accent:#3DB0A3; --accent-ink:#0B1513; --accent-soft:#163430;
  --waste:#EE9450; --waste-soft:#3A2516; --danger:#F07167; --danger-soft:#3B1A18; --ok:#6CC070; --warn:#E0B54A; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
button,select,input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);font-weight:700;margin:0;text-wrap:balance;letter-spacing:.01em}
.num{font-variant-numeric:tabular-nums}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;min-width:0}
.brand h1{font-size:22px;text-transform:uppercase;letter-spacing:.04em}
.brand small{color:var(--muted);font-size:12px}
.tabs{display:flex;gap:4px;overflow-x:auto;flex:1 1 auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 12px;border-radius:8px;font-family:var(--f-disp);font-weight:600;font-size:16px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);white-space:nowrap;cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--panel)}
.tab:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.ok{background:var(--ok)} .dot.live{background:var(--waste);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}}

main{padding-block:16px 40px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sec-h h2{font-size:26px}
.hint{color:var(--muted);font-size:13px;max-width:70ch}

/* buttons */
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.wst{background:var(--waste);border-color:var(--waste);color:#fff}
.btn.dng{color:var(--danger);border-color:var(--danger)}
.btn.armed{background:var(--danger);color:#fff;border-color:var(--danger)}
.btn.sm{min-height:34px;padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text],input[type=number]{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 10px;min-height:40px;max-width:100%}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;min-height:34px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.chip.w[aria-pressed="true"]{background:var(--waste);border-color:var(--waste);color:#fff}

/* Aufnahme grid */
.grid-st{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0;overflow:hidden}
.st.is-waste{border-color:var(--waste);box-shadow:0 0 0 1px var(--waste)}
.st-h{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.st-h h3{font-size:20px;line-height:1}
.worker{color:var(--muted);font-size:13px;margin-left:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%}
.badge{font-family:var(--f-disp);font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1.5px solid currentColor}
.badge.VM{color:#3D6FB6} .badge.EM{color:var(--accent)}
.blk{padding:10px 12px;display:grid;gap:8px}
.blk+.blk{border-top:1px dashed var(--line)}
.blk-l{font-family:var(--f-disp);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.trow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.trow select{flex:1 1 140px;min-width:0}
.timer{font-family:var(--f-mono);font-weight:700;font-size:30px;line-height:1;letter-spacing:-.02em}
.st.is-run .prod .timer{color:var(--accent)}
.waste-run{background:var(--waste-soft);border-radius:8px;padding:8px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.waste-run .timer{color:var(--waste);font-size:26px}
.waste-run .lbl{font-weight:600;flex:1 1 auto;min-width:0}
.pause-run{background:var(--panel2);border:1px dashed var(--muted);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:10px}
.pause-run .lbl{font-weight:600;flex:1 1 auto;color:var(--muted)}
.pause-run .timer{font-size:20px;color:var(--muted)}
.st.is-pause{opacity:.92}
.st.is-pause .prod .timer{color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:600}
.st-f{margin-top:auto;padding:8px 12px;background:var(--panel2);border-top:1px solid var(--line);display:flex;gap:12px;font-size:13px;flex-wrap:wrap}
.st-f b{font-family:var(--f-mono);font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:1 1 80px;align-self:center}
.bar i{display:block;height:100%;background:var(--waste)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.panel h3{font-size:19px;margin-bottom:10px}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.kpi span{display:block;font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.07em;font-size:12px;color:var(--muted)}
.kpi b{font-family:var(--f-mono);font-size:22px;font-weight:700}
.kpi.w b{color:var(--waste)}
.pie-wrap{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.pie-wrap svg{flex:0 0 auto;width:170px;height:170px;max-width:100%}
.legend{flex:1 1 180px;min-width:0;display:grid;gap:4px;font-size:13px}
.legend div{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px}
.legend em{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:12px}
.legend strong{font-family:var(--f-mono);font-size:12px;min-width:44px;text-align:right}
.multi{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.multi .panel h3{font-size:17px;display:flex;align-items:center;gap:8px}
.multi .pie-wrap svg{width:120px;height:120px}
.tbl-w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-family:var(--f-disp);font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-size:12px;color:var(--muted)}
td.r,th.r{text-align:right;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:14px;padding:18px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.mt{margin-top:12px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}

/* drawing areas */
.draw-cols{display:grid;gap:12px;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)}
@media (max-width:860px){.draw-cols{grid-template-columns:1fr}}
.canvas{width:100%;height:auto;display:block;border-radius:8px;background:var(--panel2);touch-action:manipulation;cursor:crosshair;user-select:none;-webkit-user-select:none}
.toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:8px 12px;font-weight:600;cursor:pointer;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.stat-list{display:grid;gap:6px;font-size:14px}
.stat-list div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:5px}
.stat-list b{font-family:var(--f-mono)}
.lights{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.light{flex:1 1 90px;border-radius:8px;padding:8px 10px;font-size:13px}
.light b{display:block;font-family:var(--f-mono);font-size:20px}
.light.g{background:color-mix(in srgb,var(--ok) 16%,transparent)} .light.y{background:color-mix(in srgb,var(--warn) 18%,transparent)} .light.r{background:color-mix(in srgb,var(--danger) 16%,transparent)}

/* setup */
.ed-row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1.2fr) 150px auto;gap:8px;align-items:center;padding-block:6px;border-bottom:1px solid var(--line)}
.ed-row.t{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) 70px auto}
.ed-row.p{grid-template-columns:minmax(0,1fr) 70px auto}
@media (max-width:620px){.ed-row,.ed-row.t{grid-template-columns:1fr 1fr}}
.ed-row input,.ed-row select{width:100%}
.cnt{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,14,12,.5);display:grid;place-items:center;padding:16px}
.modal-c{background:var(--panel);border-radius:12px;padding:18px;width:min(440px,100%);display:grid;gap:12px;border:1px solid var(--line)}
.modal-c label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.modal-c input,.modal-c select,.modal-c textarea{width:100%}
.modal-c textarea{min-height:200px;font-family:var(--f-mono);font-size:11px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);padding:8px}
.modal-a{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;z-index:60;font-weight:600;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><h1>Muda-Aufnahme</h1><small id="clock" class="num"></small></div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="status" id="status"><span class="dot"></span><span>Lädt…</span></div>
  </div>
</header>
<main class="wrap" id="app"></main>
<div id="modal-root"></div>

<script>
(()=>{
/* ---------- Konstanten ---------- */
const MUDA = {
  T:{n:"Transport",c:"#3D6FB6"}, I:{n:"Bestände",c:"#8A6BBE"}, M:{n:"Bewegung",c:"#D9822B"},
  W:{n:"Warten",c:"#C2416A"}, O:{n:"Überbearbeitung",c:"#6E8B2E"}, P:{n:"Überproduktion",c:"#A88A1E"},
  D:{n:"Fehler / Nacharbeit",c:"#8B5A3C"}, S:{n:"Sonstiges",c:"#7C8783"}
};
const PAL = ["#0B8278","#D9822B","#3D6FB6","#C2416A","#6E8B2E","#8A6BBE","#A88A1E","#4E93B5","#8B5A3C","#C2549A","#4C9A6A","#7C8783","#B5651D","#5E6CC4"];
const ZONES = {1:"Zone 1 · Hauptgreifraum",2:"Zone 2 · Erweiterter Greifraum",3:"Zone 3 · Oberkörper beugen/drehen",4:"Zone 4 · Außerhalb, Schritt nötig"};
const ZONE_C = {1:"#2E7D32",2:"#8BAA2E",3:"#D9A21E",4:"#C2416A"};
const DIRS = {V:"Vorne",L:"Links",R:"Rechts",H:"Hinten"};
const DIR_C = {V:"#0B8278",L:"#3D6FB6",R:"#8A6BBE",H:"#C2416A"};
const TABS = [["auf","Aufnahme"],["spa","Spaghetti"],["gre","Greifraum"],["aus","Auswertung"],["pro","Protokoll"],["dat","Einrichtung & Export"]];
const LS_KEY = "muda-aufnahme-v1";

/* ---------- Helfer ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now = () => Date.now();
const pad = n => String(n).padStart(2,"0");
function fmt(ms){ ms=Math.max(0,ms|0); const s=Math.floor(ms/1000), h=Math.floor(s/3600), m=Math.floor(s%3600/60); return h?`${h}:${pad(m)}:${pad(s%60)}`:`${pad(m)}:${pad(s%60)}`; }
const de1 = n => n.toLocaleString("de-DE",{maximumFractionDigits:1,minimumFractionDigits:1});
const de0 = n => Math.round(n).toLocaleString("de-DE");
const pct = (a,b) => b>0 ? de1(a/b*100)+" %" : "–";
const tod = t => { const d=new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
const dts = t => { if(!t) return ""; const d=new Date(t); return `${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()} ${tod(t)}`; };
const secs = ms => Math.round(ms/100)/10;

/* ---------- Zustand ---------- */
function freshState(){
  const st = [["VM 1","VM"],["VM 2","VM"],["VM 3","VM"],["EM 1","EM"],["EM 2","EM"],["EM 3","EM"]].map(([n,t])=>({id:uid(),name:n,worker:"",type:t,productId:null}));
  const types = [["Teile suchen","M"],["Werkzeug holen","M"],["Material holen","T"],["Warten auf Material","W"],["Warten auf Vorgänger","W"],["Nacharbeit","D"],["Verpackung entfernen","O"],["Rückfragen / Klärung","S"]]
    .map(([n,m])=>({id:uid(),name:n,muda:m}));
  const spa = {}; st.forEach(s=>spa[s.id]={w:10,h:6,landmarks:[],pts:[]});
  return {v:1,savedAt:0,stations:st,wasteTypes:types,products:[],runs:[],wastes:[],grips:[],spa};
}
let S = freshState();
const UI = {tab:"auf",scope:"all",spaSid:null,spaMode:"weg",greSid:null,greScope:"all",proSid:"all"};

function loadLocal(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ const d=JSON.parse(raw); if(d&&d.stations) S=normalize(d);} }catch(e){}
  try{ const t=localStorage.getItem(LS_KEY+"-tab"); if(t&&TABS.some(x=>x[0]===t)) UI.tab=t; }catch(e){}
}
function normalize(d){
  const f=freshState();
  d.stations=d.stations||[]; d.wasteTypes=d.wasteTypes||f.wasteTypes; d.products=d.products||[];
  d.runs=d.runs||[]; d.wastes=d.wastes||[]; d.grips=d.grips||[]; d.spa=d.spa||{};
  d.stations.forEach(s=>{ if(!d.spa[s.id]) d.spa[s.id]={w:10,h:6,landmarks:[],pts:[]}; });
  return d;
}

/* ---------- Speichern (lokal + Cloud) ---------- */
let db=null, dbRef=null, saveTimer=null, saving=false, pendingSave=false, cloudState="local", tooBig=false;
function commit(){ S.savedAt=now(); try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){} clearTimeout(saveTimer); saveTimer=setTimeout(cloudSave,900); render(); }
async function cloudSave(){
  if(!dbRef) return;
  if(saving){ pendingSave=true; return; }
  const json=JSON.stringify(S);
  if(json.length>240000){ tooBig=true; setStatus(); return; }
  tooBig=false; saving=true;
  try{ await dbRef.set({json,savedAt:S.savedAt}); cloudState="cloud"; }catch(e){ cloudState="err"; }
  saving=false; setStatus();
  if(pendingSave){ pendingSave=false; cloudSave(); }
}
async function initCloud(){
  try{
    if(!window.claude||!window.claude.use) return;
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u) return;
    const id=await u.id(); if(!id) return;
    db=d; dbRef=db.doc("data/users/"+id+"/aufnahme");
    const snap=await dbRef.get();
    if(snap.exists){
      const data=snap.data();
      if(data&&data.json&&(data.savedAt||0)>(S.savedAt||0)){
        S=normalize(JSON.parse(data.json));
        try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}
        render();
      } else if((S.savedAt||0)>(data?.savedAt||0)) cloudSave();
    } else if(S.savedAt) cloudSave();
    cloudState="cloud"; setStatus();
  }catch(e){ cloudState="local"; setStatus(); }
}
function setStatus(){
  const live = S.wastes.some(w=>!w.end)||S.runs.some(r=>!r.end);
  let txt = cloudState==="cloud"?"In deinem Konto gespeichert":cloudState==="err"?"Cloud-Speichern fehlgeschlagen, lokal gesichert":"Auf diesem Gerät gespeichert";
  if(tooBig) txt="Daten zu groß für Cloud, lokal gesichert – bitte exportieren";
  $("#status").innerHTML=`<span class="dot ${live?"live":(cloudState==="cloud"?"ok":"")}"></span><span>${live?"Messung läuft · ":""}${txt}</span>`;
}

/* ---------- Abfragen ---------- */
const stById = id => S.stations.find(s=>s.id===id);
const typeById = id => S.wasteTypes.find(t=>t.id===id);
const prodById = id => S.products.find(p=>p.id===id);
const runOf = sid => S.runs.find(r=>r.stationId===sid&&!r.end);
const wasteOf = sid => S.wastes.find(w=>w.stationId===sid&&!w.end);
const pausedMs = x => (x.pauses||[]).reduce((a,p)=>a+Math.max(0,(p.end||x.end||now())-p.start),0);
const dur = x => Math.max(0,(x.end||now())-x.start-pausedMs(x));
const isPaused = r => !!(r&&r.pauses&&r.pauses.length&&!r.pauses[r.pauses.length-1].end);
const closePause = (r,t) => { if(isPaused(r)) r.pauses[r.pauses.length-1].end=t; };
const typeColor = id => { const i=S.wasteTypes.findIndex(t=>t.id===id); return PAL[(i<0?0:i)%PAL.length]; };
function rawOv(s1,e1,s2,e2){ return Math.max(0,Math.min(e1,e2)-Math.max(s1,s2)); }
function overlap(a,b){ const ae=a.end||now(), be=b.end||now(); let o=rawOv(a.start,ae,b.start,be); (b.pauses||[]).forEach(p=>o-=rawOv(a.start,ae,p.start,p.end||be)); return Math.max(0,o); }
function inScope(sid,scope){ if(scope==="all") return true; if(scope==="VM"||scope==="EM") return stById(sid)?.type===scope; return sid===scope; }
function typeUsage(sid){ const m={}; S.wastes.forEach(w=>{ if(!sid||w.stationId===sid) m[w.typeId]=(m[w.typeId]||0)+1; }); return m; }
function stationStats(sid){
  const runs=S.runs.filter(r=>r.stationId===sid), done=runs.filter(r=>r.end);
  const wastes=S.wastes.filter(w=>w.stationId===sid);
  const wsum=wastes.reduce((a,w)=>a+dur(w),0);
  const rsum=runs.reduce((a,r)=>a+dur(r),0);
  const winRuns=wastes.reduce((a,w)=>a+runs.reduce((b,r)=>b+overlap(w,r),0),0);
  const avg=done.length?done.reduce((a,r)=>a+dur(r),0)/done.length:0;
  return {done:done.length,avg,last:done.length?dur(done[done.length-1]):0,wsum,rsum,winRuns,n:wastes.length};
}

/* ---------- Aktionen Messung ---------- */
let wakeLock=null;
async function keepAwake(){ try{ if(!wakeLock&&navigator.wakeLock){ wakeLock=await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release",()=>wakeLock=null);} }catch(e){} }
function startRun(sid){
  const s=stById(sid); if(!s.productId){ return openProductModal(sid,true); }
  S.runs.push({id:uid(),stationId:sid,productId:s.productId,start:now(),end:null}); keepAwake(); commit();
}
function nextRun(sid){
  const r=runOf(sid); const t=now();
  if(r){ closePause(r,t); r.end=t; const w=wasteOf(sid); if(w&&w.runId===r.id){ /* Verschwendung läuft weiter: neuem Zyklus zuordnen */ w.end=t; S.wastes.push({id:uid(),stationId:sid,typeId:w.typeId,start:t,end:null,runId:null}); } }
  const s=stById(sid); const nr={id:uid(),stationId:sid,productId:s.productId,start:t,end:null}; S.runs.push(nr);
  const w2=wasteOf(sid); if(w2&&!w2.runId) w2.runId=nr.id;
  commit(); toast(`${s.name}: Teil abgeschlossen (${fmt(r?dur(r):0)})`);
}
function stopRun(sid){ const r=runOf(sid); if(r){ const t=now(); closePause(r,t); r.end=t; commit(); } }
function pauseRun(sid,silent){ const r=runOf(sid); if(!r||isPaused(r)) return; const t=now(); const w=wasteOf(sid); if(w) w.end=t; (r.pauses=r.pauses||[]).push({start:t,end:null}); if(!silent) commit(); }
function resumeRun(sid,silent){ const r=runOf(sid); if(!isPaused(r)) return; closePause(r,now()); if(!silent) commit(); }
function startWaste(sid,typeId){
  const cur=wasteOf(sid); const t=now();
  if(cur){ cur.end=t; if(cur.typeId===typeId){ commit(); return; } }
  const r=runOf(sid); closePause(r,t);
  S.wastes.push({id:uid(),stationId:sid,typeId,start:t,end:null,runId:r?r.id:null}); keepAwake(); commit();
}
function stopWaste(sid){ const w=wasteOf(sid); if(w){ w.end=now(); commit(); } }

/* ---------- Modal ---------- */
function modal(html,onSubmit){
  const root=$("#modal-root");
  root.innerHTML=`<div class="modal" id="mdl"><form class="modal-c" id="mdlf">${html}</form></div>`;
  const f=$("#mdlf");
  const close=()=>root.innerHTML="";
  f.addEventListener("submit",e=>{ e.preventDefault(); const fd=Object.fromEntries(new FormData(f)); if(onSubmit(fd)!==false) close(); });
  f.querySelector("[data-cancel]")?.addEventListener("click",close);
  $("#mdl").addEventListener("click",e=>{ if(e.target.id==="mdl") close(); });
  setTimeout(()=>f.querySelector("input,textarea")?.focus(),30);
}
function openWasteTypeModal(sid){
  const t0=now(); // Zeit läuft ab dem Antippen, auch während der Name eingegeben wird
  if(sid) keepAwake();
  const opts=Object.entries(MUDA).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join("");
  modal(`<h3>Neue Verschwendungsart</h3>
    ${sid?`<div class="waste-run"><span class="lbl">${esc(stById(sid)?.name)} · Zeit läuft</span><span class="timer num" data-tick="${t0}">00:00</span></div>`:""}
    <label>Bezeichnung<input type="text" name="n" id="m-wn" required maxlength="60" placeholder="z. B. Schrauben nachfüllen"></label>
    <label>Muda-Kategorie<select name="m" id="m-wm">${opts}</select></label>
    <p class="hint">Steht danach an allen Arbeitsplätzen im Auswahlfeld.${sid?" Die Zeit zählt seit dem Antippen. Abbrechen verwirft sie.":""}</p>
    <div class="modal-a"><button type="button" class="btn" data-cancel>Abbrechen</button><button class="btn ${sid?"wst":"pri"}">${sid?"Speichern, Zeit läuft weiter":"Anlegen"}</button></div>`,
  fd=>{ const n=fd.n.trim(); if(!n) return false;
    let t=S.wasteTypes.find(x=>x.name.toLowerCase()===n.toLowerCase());
    if(!t){ t={id:uid(),name:n,muda:fd.m}; S.wasteTypes.push(t); }
    if(sid){
      const cur=wasteOf(sid);
      if(cur){ cur.end=Math.max(cur.start,t0); }
      const r=S.runs.find(x=>x.stationId===sid&&x.start<=t0&&(!x.end||x.end>t0)); closePause(runOf(sid),t0);
      S.wastes.push({id:uid(),stationId:sid,typeId:t.id,start:t0,end:null,runId:r?r.id:null});
    }
    commit(); });
}
function openProductModal(sid,autostart){
  modal(`<h3>Produkt anlegen</h3>
    <label>Produktbezeichnung / Sachnummer<input type="text" name="n" id="m-pn" required maxlength="60" placeholder="z. B. Anzeige 4711-B"></label>
    <div class="modal-a"><button type="button" class="btn" data-cancel>Abbrechen</button><button class="btn pri">${autostart?"Anlegen & Zeit starten":"Anlegen"}</button></div>`,
  fd=>{ const n=fd.n.trim(); if(!n) return false;
    let p=S.products.find(x=>x.name.toLowerCase()===n.toLowerCase()); if(!p){ p={id:uid(),name:n}; S.products.push(p); }
    if(sid){ const s=stById(sid); s.productId=p.id; const r=runOf(sid); if(r) r.productId=p.id; }
    if(sid&&autostart){ S.runs.push({id:uid(),stationId:sid,productId:p.id,start:now(),end:null}); keepAwake(); }
    commit(); });
}
let toastT;
function toast(msg){ let el=$(".toast"); if(!el){ el=document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el);} el.textContent=msg; clearTimeout(toastT); toastT=setTimeout(()=>el.remove(),2600); }

/* ---------- Diagramme ---------- */
function pie(items,{size=170,center=""}={}){
  const tot=items.reduce((a,b)=>a+b.v,0);
  if(!tot) return `<div class="empty">Noch keine Daten</div>`;
  const R=80, r0=48, cx=100, cy=100; let a0=-Math.PI/2, paths="";
  const pt=(rad,a)=>[cx+rad*Math.cos(a),cy+rad*Math.sin(a)];
  items.forEach(it=>{
    if(!it.v) return;
    const frac=it.v/tot;
    if(frac>0.9999){ paths+=`<circle cx="${cx}" cy="${cy}" r="${(R+r0)/2}" fill="none" stroke="${it.c}" stroke-width="${R-r0}"><title>${esc(it.l)}</title></circle>`; return; }
    const a1=a0+frac*2*Math.PI, lg=frac>.5?1:0;
    const [x0,y0]=pt(R,a0),[x1,y1]=pt(R,a1),[x2,y2]=pt(r0,a1),[x3,y3]=pt(r0,a0);
    paths+=`<path d="M${x0} ${y0}A${R} ${R} 0 ${lg} 1 ${x1} ${y1}L${x2} ${y2}A${r0} ${r0} 0 ${lg} 0 ${x3} ${y3}Z" fill="${it.c}" stroke="var(--panel)" stroke-width="1.5"><title>${esc(it.l)}: ${pct(it.v,tot)}</title></path>`;
    a0=a1;
  });
  const leg=items.filter(i=>i.v).map(i=>`<div><i style="background:${i.c}"></i><span>${esc(i.l)}</span><em>${i.fmt?i.fmt(i.v):fmt(i.v)}</em><strong>${pct(i.v,tot)}</strong></div>`).join("");
  return `<div class="pie-wrap"><svg viewBox="0 0 200 200" role="img" aria-label="Kreisdiagramm">${paths}<text x="100" y="97" text-anchor="middle" font-family="JetBrains Mono,monospace" font-weight="700" font-size="20" fill="var(--ink)">${center||fmt(tot)}</text><text x="100" y="116" text-anchor="middle" font-size="11" fill="var(--muted)">gesamt</text></svg><div class="legend">${leg}</div></div>`;
}
function wasteByType(list){ const m={}; list.forEach(w=>m[w.typeId]=(m[w.typeId]||0)+dur(w)); return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([id,v])=>({l:typeById(id)?.name||"?",v,c:typeColor(id)})); }
function wasteByMuda(list){ const m={}; list.forEach(w=>{ const k=typeById(w.typeId)?.muda||"S"; m[k]=(m[k]||0)+dur(w); }); return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>({l:MUDA[k].n,v,c:MUDA[k].c})); }

function renderTabs(){
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button class="tab" role="tab" id="tab-${k}" aria-selected="${UI.tab===k}" data-act="tab" data-k="${k}">${l}</button>`).join("");
}
function render(){
  renderTabs(); setStatus();

  if(UI.tab==="gre") bindGre();
}

/* --- Aufnahme --- */
function vAuf(){
  if(!S.stations.length) return `<div class="empty">Keine Arbeitsplätze angelegt. Unter „Einrichtung & Export“ hinzufügen.</div>`;
  const groups=[["VM","Vormontage"],["EM","Endmontage"]];
  const anyRun=S.runs.some(r=>!r.end&&!isPaused(r)), anyPause=S.runs.some(r=>!r.end&&isPaused(r));
  return `<div class="sec-h"><h2>Aufnahme</h2><div class="trow">${anyRun?`<button class="btn" data-act="pauseAll">⏸ Alle pausieren</button>`:""}${anyPause?`<button class="btn pri" data-act="resumeAll">▶ Alle fortsetzen</button>`:""}</div><p class="hint">Pause hält die Montagezeit an und beendet eine laufende Verschwendung. Pausenzeit zählt nirgends mit. Oben die Montagezeit pro Teil, unten die Verschwendung. Antippen einer Art startet die Zeit, erneutes Antippen stoppt sie. Ein Wechsel der Art beendet die laufende automatisch.</p></div>
  <div class="grid-st">${groups.map(([k])=>S.stations.filter(s=>s.type===k).map(stCard).join("")).join("")}</div>`;
}
function stCard(s){
  const r=runOf(s.id), w=wasteOf(s.id), st=stationStats(s.id), paused=isPaused(r), pz=paused?r.pauses[r.pauses.length-1]:null;
  const prodOpts=`<option value="">Produkt wählen…</option>`+S.products.map(p=>`<option value="${p.id}" ${s.productId===p.id?"selected":""}>${esc(p.name)}</option>`).join("")+`<option value="__new">＋ Neues Produkt…</option>`;
  const use=typeUsage(s.id), useAll=typeUsage();
  const top=[...S.wasteTypes].sort((a,b)=>((use[b.id]||0)*100+(useAll[b.id]||0))-((use[a.id]||0)*100+(useAll[a.id]||0))).slice(0,6);
  if(w&&!top.some(t=>t.id===w.typeId)) top.unshift(typeById(w.typeId));
  const allOpts=`<option value="">Weitere Art…</option>`+S.wasteTypes.map(t=>`<option value="${t.id}">${esc(t.name)} (${MUDA[t.muda].n})</option>`).join("")+`<option value="__new">＋ Neue Verschwendungsart…</option>`;
  const share=st.rsum?Math.min(100,st.winRuns/st.rsum*100):0;
  return `<article class="st ${r&&!paused?"is-run":""} ${paused?"is-pause":""} ${w?"is-waste":""}" aria-label="${esc(s.name)}">
    <header class="st-h"><span class="badge ${s.type}">${s.type==="VM"?"Vormontage":"Endmontage"}</span><h3>${esc(s.name)}</h3><span class="worker">${esc(s.worker||"kein Werker hinterlegt")}</span></header>
    <section class="blk prod">
      <div class="blk-l"><span>Montagezeit je Teil</span><span class="num">${st.done} Teile</span></div>
      <div class="trow"><select id="prod-${s.id}" data-chg="prod" data-sid="${s.id}" aria-label="Produkt">${prodOpts}</select>
        <span class="timer num" data-tick="${r&&!paused?now()-dur(r):""}">${r?fmt(dur(r)):"00:00"}</span></div>
      ${paused?`<div class="pause-run"><span class="lbl">⏸ Pause</span><span class="timer num" data-tick="${pz.start}">${fmt(now()-pz.start)}</span></div>`:""}
      <div class="trow">${!r?`<button class="btn pri" data-act="startRun" data-sid="${s.id}">▶ Zeit starten</button>`
        :paused?`<button class="btn pri" data-act="resume" data-sid="${s.id}">▶ Fortsetzen</button><button class="btn" data-act="next" data-sid="${s.id}">Teil fertig</button><button class="btn" data-act="stopRun" data-sid="${s.id}">Stopp</button>`
        :`<button class="btn pri" data-act="next" data-sid="${s.id}">Teil fertig ▸ nächstes</button><button class="btn" data-act="pause" data-sid="${s.id}" aria-label="Pause">⏸ Pause</button><button class="btn" data-act="stopRun" data-sid="${s.id}">Stopp</button>`}</div>
      <div class="meta"><span>Ø <b class="num">${st.avg?fmt(st.avg):"–"}</b></span><span>Letztes <b class="num">${st.last?fmt(st.last):"–"}</b></span></div>
    </section>
    <section class="blk waste">
      <div class="blk-l"><span>Verschwendung</span><span class="num">${st.n} Ereignisse</span></div>
      ${w?`<div class="waste-run"><span class="lbl">${esc(typeById(w.typeId)?.name)}</span><span class="timer num" data-tick="${w.start}">${fmt(dur(w))}</span><button class="btn wst" data-act="stopWaste" data-sid="${s.id}">■ Stopp</button></div>`:""}
      <div class="chips">${top.map(t=>`<button class="chip w" aria-pressed="${w&&w.typeId===t.id}" data-act="waste" data-sid="${s.id}" data-t="${t.id}">${esc(t.name)}</button>`).join("")}</div>
      <select id="wsel-${s.id}" data-chg="waste" data-sid="${s.id}" aria-label="Verschwendungsart wählen">${allOpts}</select>
    </section>
    <footer class="st-f"><span>Σ Verschw. <b class="num" data-tick-sum="${s.id}">${fmt(st.wsum)}</b></span><span>Anteil an Montagezeit <b class="num">${st.rsum?de1(share)+" %":"–"}</b></span><span class="bar"><i style="width:${share}%"></i></span></footer>
  </article>`;
}

/* --- Auswertung --- */
function scopeChips(cur,act){
  const opts=[["all","Alle Arbeitsplätze"],["VM","Vormontage"],["EM","Endmontage"],...S.stations.map(s=>[s.id,s.name])];
  return `<div class="filters" role="group" aria-label="Filter">${opts.map(([k,l])=>`<button class="chip" aria-pressed="${cur===k}" data-act="${act}" data-k="${k}">${esc(l)}</button>`).join("")}</div>`;
}
function vAus(){
  const sc=UI.scope;
  const W=S.wastes.filter(w=>inScope(w.stationId,sc)), R=S.runs.filter(r=>inScope(r.stationId,sc));
  const wsum=W.reduce((a,w)=>a+dur(w),0), rsum=R.reduce((a,r)=>a+dur(r),0);
  const winR=W.reduce((a,w)=>a+R.reduce((b,r)=>b+(r.stationId===w.stationId?overlap(w,r):0),0),0);
  const done=R.filter(r=>r.end);
  const kp=`<div class="kpis">
    <div class="kpi w"><span>Σ Verschwendung</span><b class="num">${fmt(wsum)}</b></div>
    <div class="kpi"><span>Ereignisse</span><b class="num">${W.length}</b></div>
    <div class="kpi"><span>Erfasste Montagezeit</span><b class="num">${fmt(rsum)}</b></div>
    <div class="kpi w"><span>Verschw.-Anteil Montage</span><b class="num">${pct(winR,rsum)}</b></div>
    <div class="kpi"><span>Fertige Teile</span><b class="num">${done.length}</b></div>
    <div class="kpi"><span>Ø Verschw. je Teil</span><b class="num">${done.length?fmt(done.reduce((a,r)=>a+W.reduce((b,w)=>b+(w.stationId===r.stationId?overlap(w,r):0),0),0)/done.length):"–"}</b></div>
  </div>`;
  const vmW=S.wastes.filter(w=>stById(w.stationId)?.type==="VM"), emW=S.wastes.filter(w=>stById(w.stationId)?.type==="EM");
  const cmp=(lbl,list)=>{ const runs=S.runs.filter(r=>stById(r.stationId)?.type===(lbl==="Vormontage"?"VM":"EM")); const rs=runs.reduce((a,r)=>a+dur(r),0); const wi=list.reduce((a,w)=>a+runs.reduce((b,r)=>b+(r.stationId===w.stationId?overlap(w,r):0),0),0);
    return `<div class="panel"><h3>${lbl}</h3><div class="meta" style="margin-bottom:8px"><span>Σ <b class="num">${fmt(list.reduce((a,w)=>a+dur(w),0))}</b></span><span>Anteil an Montagezeit <b class="num">${pct(wi,rs)}</b></span><span>Teile <b class="num">${runs.filter(r=>r.end).length}</b></span></div>${pie(wasteByMuda(list))}<div class="mt">${pie(wasteByType(list))}</div></div>`; };
  const per=S.stations.filter(s=>inScope(s.id,sc==="all"||sc==="VM"||sc==="EM"?sc:"all")).map(s=>{ const l=S.wastes.filter(w=>w.stationId===s.id); const st=stationStats(s.id);
    return `<div class="panel"><h3><span class="badge ${s.type}">${s.type}</span>${esc(s.name)}<small class="hint" style="margin-left:auto">${esc(s.worker)}</small></h3><div class="meta" style="margin-bottom:6px"><span>Anteil <b class="num">${pct(st.winRuns,st.rsum)}</b></span><span>Ø Zyklus <b class="num">${st.avg?fmt(st.avg):"–"}</b></span></div>${pie(wasteByType(l))}</div>`; }).join("");
  // Top-Tabelle
  const byT={}; W.forEach(w=>{ const o=byT[w.typeId]||(byT[w.typeId]={n:0,s:0,st:new Set()}); o.n++; o.s+=dur(w); o.st.add(w.stationId); });
  const topRows=Object.entries(byT).sort((a,b)=>b[1].s-a[1].s).map(([id,o])=>{ const t=typeById(id); return `<tr><td><i style="display:inline-block;width:10px;height:10px;border-radius:2px;background:${typeColor(id)};margin-right:6px"></i>${esc(t?.name)}</td><td>${MUDA[t?.muda||"S"].n}</td><td class="r">${o.n}</td><td class="r">${fmt(o.s)}</td><td class="r">${fmt(o.s/o.n)}</td><td class="r">${pct(o.s,wsum)}</td><td>${[...o.st].map(x=>esc(stById(x)?.name)).join(", ")}</td></tr>`; }).join("");
  // Produkte
  const byP={}; done.forEach(r=>{ const k=r.productId+"|"+(stById(r.stationId)?.type||""); const o=byP[k]||(byP[k]={pid:r.productId,typ:stById(r.stationId)?.type,d:[],w:[]}); o.d.push(dur(r)); o.w.push(S.wastes.reduce((a,w)=>a+(w.stationId===r.stationId?overlap(w,r):0),0)); });
  const prodRows=Object.values(byP).map(o=>{ const n=o.d.length, avg=o.d.reduce((a,b)=>a+b,0)/n, aw=o.w.reduce((a,b)=>a+b,0)/n;
    return `<tr><td>${esc(prodById(o.pid)?.name||"–")}</td><td>${o.typ==="VM"?"Vormontage":"Endmontage"}</td><td class="r">${n}</td><td class="r">${fmt(avg)}</td><td class="r">${fmt(Math.min(...o.d))}</td><td class="r">${fmt(Math.max(...o.d))}</td><td class="r">${fmt(aw)}</td><td class="r">${fmt(avg-aw)}</td><td class="r">${pct(aw,avg)}</td></tr>`; }).join("");
  return `<div class="sec-h"><h2>Auswertung</h2><div class="trow"><button class="btn" data-act="expP">PDF-Bericht</button><button class="btn" data-act="expX">Excel</button></div><p class="hint">Verschwendungsanteil = Verschwendung, die während einer laufenden Montagezeit lag, geteilt durch die erfasste Montagezeit.</p></div>
  ${scopeChips(sc,"scope")}${kp}
  <div class="cols"><div class="panel"><h3>Nach Verschwendungsart</h3>${pie(wasteByType(W))}</div><div class="panel"><h3>Nach Muda-Kategorie (7 Arten)</h3>${pie(wasteByMuda(W))}</div></div>
  <h2 class="mt" style="font-size:22px">Vormontage und Endmontage im Vergleich</h2>
  <div class="cols mt">${cmp("Vormontage",vmW)}${cmp("Endmontage",emW)}</div>
  <h2 class="mt" style="font-size:22px">Je Arbeitsplatz</h2>

/* --- Spaghetti --- */
function spaStats(sid){
  const sp=S.spa[sid]; if(!sp) return null;
  let len=0,segs=0,longest=0; const pts=sp.pts;
  for(let i=1;i<pts.length;i++){ if(pts[i].brk) continue; const d=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y); len+=d; segs++; longest=Math.max(longest,d); }
  const paths=pts.filter((p,i)=>i===0||p.brk).length;
  const span=pts.length>1?pts[pts.length-1].t-pts[0].t:0;
  const visits={}; pts.forEach(p=>{ let best=null,bd=1.0; sp.landmarks.forEach(l=>{ const d=Math.hypot(l.x-p.x,l.y-p.y); if(d<bd){bd=d;best=l;} }); if(best) visits[best.id]=(visits[best.id]||0)+1; });
  const parts=S.runs.filter(r=>r.stationId===sid&&r.end).length;
  return {len,segs,longest,paths,span,visits,parts,n:pts.length};
}

/* --- Greifraum --- */
const GC={x:200,y:225}, GR={1:70,2:118,3:165};
function gripFrom(x,y){
  const dx=x-GC.x, dy=y-GC.y, r=Math.hypot(dx,dy);
  const ang=Math.atan2(dx,-dy)*180/Math.PI;
  const dir=Math.abs(ang)<=45?"V":(ang>45&&ang<=135)?"R":(ang<-45&&ang>=-135)?"L":"H";
  const zone=r<=GR[1]?1:r<=GR[2]?2:r<=GR[3]?3:4;
  return {zone,dir};
}
function gripRating(g){ if(g.dir==="H"||g.zone===4) return "r"; if(g.zone===1) return "g"; if(g.zone===2) return g.dir==="V"?"g":"y"; return g.dir==="V"?"y":"r"; }
function sectorPath(r0,r1,d0,d1){
  const P=(r,d)=>[GC.x+r*Math.sin(d*Math.PI/180),GC.y-r*Math.cos(d*Math.PI/180)];
  const [a,b]=P(r1,d0),[c,d]=P(r1,d1),[e,f]=P(r0,d1),[g,h]=P(r0,d0);
  return r0>0?`M${a} ${b}A${r1} ${r1} 0 0 1 ${c} ${d}L${e} ${f}A${r0} ${r0} 0 0 0 ${g} ${h}Z`:`M${GC.x} ${GC.y}L${a} ${b}A${r1} ${r1} 0 0 1 ${c} ${d}Z`;
}

  return `<div class="sec-h"><h2>Greifraumanalyse</h2><p class="hint">Draufsicht: Werker in der Mitte, Werkbank vorne. Tippe dorthin, wo der Werker hingreift. Die App ordnet Zone und Richtung automatisch zu. Alternativ die Schnellerfassung nutzen.</p></div>

/* ---------- Export ---------- */
async function offerFile(filename,data,fallbackText){
  const type=filename.endsWith(".xlsx")?"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet":filename.endsWith(".pdf")?"application/pdf":"application/json";
  const blob=new Blob([data],{type});
  try{
    const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:filename}); toast("Datei übergeben"); return; }
  }catch(e){ if(e&&e.name==="AbortError"){ toast("Abgebrochen"); return; } }
  try{ const url=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),60000); toast("Download gestartet"); return; }catch(e){}
  if(!fallbackText){ toast("Datei konnte nicht übergeben werden"); return; }
  modal(`<h3>Download nicht möglich</h3><p class="hint">Kopiere die Sicherung und speichere sie als .json-Datei.</p><textarea id="m-copy" readonly>${esc(fallbackText||"")}</textarea>
    <div class="modal-a"><button type="button" class="btn" data-cancel>Schließen</button><button class="btn pri">Kopieren</button></div>`,
    ()=>{ const ta=$("#m-copy"); navigator.clipboard?.writeText(ta.value).then(()=>toast("Kopiert"),()=>{ta.select();}); return false; });
}

  table([{h:"Produkt",w:120,b:1},{h:"Bereich",w:64},{h:"Teile",w:34,r:1},{h:"Ø Zyklus",w:50,r:1},{h:"Min",w:44,r:1},{h:"Max",w:44,r:1},{h:"Ø Verschw.",w:54,r:1},{h:"Ø ohne",w:54,r:1},{h:"Anteil",w:51.3,r:1}],
    prodStats(()=>true).map(p=>[p.name,p.bereich,String(p.n),fmt(p.avg),fmt(p.min),fmt(p.max),fmt(p.aw),fmt(p.net),pctS(p.share)]));
  // Spaghetti
  const spSt=S.stations.filter(s=>S.spa[s.id]&&(S.spa[s.id].pts.length||S.spa[s.id].landmarks.length));
  h2("Spaghetti-Diagramm – Laufwege");
  table([{h:"Arbeitsplatz",w:70,b:1},{h:"Bereich",w:64},{h:"Fläche",w:50,r:1},{h:"Laufweg",w:52,r:1},{h:"Punkte",w:40,r:1},{h:"Teile",w:36,r:1},{h:"Weg je Teil",w:56,r:1},{h:"Weg je Std.",w:56,r:1},{h:"Längste Strecke",w:91.3,r:1}],
    S.stations.map(s=>{ const sp=S.spa[s.id], x=spaStats(s.id); return [s.name,typName(s.id),`${sp.w}×${sp.h} m`,de1(x.len)+" m",String(x.n),String(x.parts),x.parts?de1(x.len/x.parts)+" m":"–",x.span>60000?de0(x.len/(x.span/3600000))+" m":"–",de1(x.longest)+" m"]; }));
  col=0; rowH=0;
  spSt.forEach(s=>{ const sp=S.spa[s.id], st=spaStats(s.id), bw=half, sc=Math.min((bw-16)/sp.w,150/sp.h), dw=sp.w*sc, dh=sp.h*sc, bh=dh+46;
    if(col===0) ensure(bh+8); else if(y+bh>H-48){ y+=rowH; col=0; rowH=0; ensure(bh+8); }
    const x=M+col*(half+16), ox=x+8, oy=y+24;
    P.text(x,y+12,`${s.name} · ${de1(st.len)} m`,{size:9,bold:true,max:bw});
    P.rect(ox,oy,dw,dh,{stroke:LINE,fill:"#FAFBFA"});
    for(let i=1;i<sp.w;i++) P.line(ox+i*sc,oy,ox+i*sc,oy+dh,{color:"#E4E8E5",lw:0.3});
    for(let i=1;i<sp.h;i++) P.line(ox,oy+i*sc,ox+dw,oy+i*sc,{color:"#E4E8E5",lw:0.3});
    let seg=[]; const flush=()=>{ P.path(seg,{color:WST,lw:1.1}); seg=[]; };
    sp.pts.forEach((p,i)=>{ if(p.brk&&i>0) flush(); seg.push([ox+p.x*sc,oy+p.y*sc]); }); flush();
    sp.pts.forEach((p,i)=>{ const c=(i===0||p.brk)?ACC:WST; P.slice(ox+p.x*sc,oy+p.y*sc,1.8,0,0,360,c); });
    sp.landmarks.forEach(l=>{ P.rect(ox+l.x*sc-3.5,oy+l.y*sc-3.5,7,7,{fill:INK}); P.text(ox+l.x*sc,oy+l.y*sc-6,`${l.name} (${st.visits[l.id]||0}×)`,{size:6.5,bold:true,align:"center"}); });
    P.text(ox,oy+dh+10,`Raster 1 m · Fläche ${sp.w} × ${sp.h} m`,{size:6.5,color:MUT});
    rowH=Math.max(rowH,bh+8); col++; if(col===2){ y+=rowH; col=0; rowH=0; } });
  if(col) y+=rowH;
  // Greifraum
  h2("Greifraumanalyse","Gut: Zone 1 oder Zone 2 nach vorne. Bedingt: Zone 2 seitlich, Zone 3 nach vorne. Kritisch: Zone 3 seitlich, Zone 4 und jeder Griff nach hinten.");
  table([{h:"Arbeitsplatz",w:62,b:1},{h:"Bereich",w:58},{h:"Griffe",w:34,r:1},{h:"Z1",w:34,r:1},{h:"Z2",w:34,r:1},{h:"Z3",w:34,r:1},{h:"Z4",w:34,r:1},{h:"Vorne",w:36,r:1},{h:"Links",w:34,r:1},{h:"Rechts",w:36,r:1},{h:"Hinten",w:36,r:1},{h:"Kritisch",w:62.3,r:1}],
    S.stations.map(s=>{ const g=gripStats(S.grips.filter(x=>x.stationId===s.id)), q=v=>g.n?pctS(v/g.n):"–"; return [s.name,typName(s.id),String(g.n),...g.z.map(q),...g.d.map(q),q(g.r)]; }));
  const GA=gripStats(S.grips);
  if(GA.n){ ensure(30); const q=v=>pctS(v/GA.n);
    [["Gut",GA.g,"#2E7D32"],["Bedingt",GA.y,"#B8860B"],["Kritisch",GA.r,"#B3261E"]].forEach(([l,v,c],i)=>{ const bw=(CW-16)/3, x=M+i*(bw+8); P.rect(x,y,bw,26,{fill:"#F4F6F5",stroke:LINE}); P.rect(x,y,4,26,{fill:c}); P.text(x+12,y+17,`${l}: ${q(v)} (${v} Griffe)`,{size:9,bold:true}); }); y+=36;
    twoDonuts([1,2,3,4].map(z=>({l:["","Z1 Hauptgreifraum","Z2 Erweitert","Z3 Oberkörper","Z4 Schritt nötig"][z],v:GA.z[z-1],c:ZONE_C[z],f:v=>v+"×"})),Object.keys(DIRS).map((k,i)=>({l:DIRS[k],v:GA.d[i],c:DIR_C[k],f:v=>v+"×"})),"Alle Plätze nach Zonen","Alle Plätze nach Richtungen",v=>String(v)); }
  // Fußzeilen
  const n=P.pages.length;
  P.pages.forEach((_,i)=>{ P.use(i); P.line(M,H-30,W-M,H-30,{color:LINE}); P.text(M,H-18,"Muda-Aufnahme Montage · Verschwendungsanalyse",{size:7,color:MUT}); P.text(W-M,H-18,`Seite ${i+1} von ${n}`,{size:7,color:MUT,align:"right"}); });
  return P.bytes();
}
function expXLSX(){ try{ offerFile(`muda-aufnahme_${stamp()}.xlsx`,buildXlsx()); }catch(e){ console.error(e); toast("Excel-Export fehlgeschlagen: "+(e.message||e)); } }
function expPDF(){ try{ offerFile(`muda-bericht_${stamp()}.pdf`,buildPdf()); }catch(e){ console.error(e); toast("PDF-Export fehlgeschlagen: "+(e.message||e)); } }

/* ---------- Beispieldaten ---------- */
function loadDemo(){
  const t0=now()-70*60000;
  let p1=S.products[0]; if(!p1){ p1={id:uid(),name:"Beispiel Anzeige A"}; S.products.push(p1); }
  let p2=S.products[1]; if(!p2){ p2={id:uid(),name:"Beispiel Baugruppe B"}; S.products.push(p2); }
  S.runs=[];S.wastes=[];S.grips=[];
  const rnd=(a,b)=>a+Math.random()*(b-a);
  S.stations.forEach((s,si)=>{
    s.productId=s.type==="VM"?p2.id:p1.id; let t=t0+rnd(0,120000);
    const base=s.type==="VM"?rnd(150,220):rnd(260,360);
    while(t<now()-120000){
      const d=base*1000*rnd(.85,1.3); const r={id:uid(),stationId:s.id,productId:s.productId,start:t,end:t+d}; S.runs.push(r);
      let wt=t+rnd(5000,30000); const k=Math.floor(rnd(0,3));
      for(let i=0;i<k&&wt<r.end-15000;i++){ const ty=S.wasteTypes[Math.floor(Math.pow(Math.random(),1.6)*S.wasteTypes.length)]; const wd=rnd(6000,40000); S.wastes.push({id:uid(),stationId:s.id,typeId:ty.id,start:wt,end:Math.min(r.end,wt+wd),runId:r.id}); wt+=wd+rnd(10000,40000); }
      t=r.end+rnd(0,15000);
    }
    for(let i=0;i<40;i++){ const z=[1,1,1,2,2,2,3,3,4][Math.floor(rnd(0,9))], d=["V","V","V","V","L","R","R","H"][Math.floor(rnd(0,8))]; S.grips.push({id:uid(),stationId:s.id,zone:z,dir:d,t:t0+i*60000,runId:null}); }
    const sp=S.spa[s.id]; if(!sp.landmarks.length) sp.landmarks=[{id:uid(),name:"Werkbank",x:sp.w*.3,y:sp.h*.5},{id:uid(),name:"Regal",x:sp.w*.85,y:sp.h*.2},{id:uid(),name:"Prüfplatz",x:sp.w*.7,y:sp.h*.8}];
    sp.pts=[]; for(let i=0;i<24;i++){ const l=sp.landmarks[i%2?0:1+Math.floor(rnd(0,sp.landmarks.length-1))]; sp.pts.push({x:Math.round((l.x+rnd(-.4,.4))*100)/100,y:Math.round((l.y+rnd(-.4,.4))*100)/100,t:t0+i*150000,brk:i===0}); }
  });
  commit(); toast("Beispieldaten geladen");
}

/* ---------- Events ---------- */
document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]"); if(!el) return;
  if(el.dataset.confirm&&!el.classList.contains("armed")){ el.classList.add("armed"); el.dataset.orig=el.innerHTML; el.textContent=el.dataset.confirm; setTimeout(()=>{ if(el.isConnected){ el.classList.remove("armed"); el.innerHTML=el.dataset.orig; } },3500); return; }
  const a=el.dataset.act, sid=el.dataset.sid, id=el.dataset.id, k=el.dataset.k;
  switch(a){
    case "tab": UI.tab=k; try{localStorage.setItem(LS_KEY+"-tab",k);}catch(_){} render(); window.scrollTo(0,0); break;
    case "startRun": startRun(sid); break;
    case "next": nextRun(sid); break;
    case "stopRun": stopRun(sid); break;
    case "pause": pauseRun(sid); break;
    case "resume": resumeRun(sid); break;
    case "pauseAll": S.stations.forEach(s=>pauseRun(s.id,true)); commit(); toast("Alle Arbeitsplätze pausiert"); break;
    case "resumeAll": S.stations.forEach(s=>resumeRun(s.id,true)); commit(); toast("Alle Arbeitsplätze laufen wieder"); break;
    case "waste": startWaste(sid,el.dataset.t); break;
    case "stopWaste": stopWaste(sid); break;
    case "scope": UI.scope=k; render(); break;
    case "spaSid": UI.spaSid=k; render(); break;
    case "spaMode": UI.spaMode=k; render(); break;
    case "spaBreak": UI.spaBrk=true; toast("Nächster Punkt beginnt einen neuen Weg"); break;
    case "spaUndo": S.spa[UI.spaSid].pts.pop(); commit(); break;
    case "spaClear": S.spa[UI.spaSid].pts=[]; commit(); break;
    case "greSid": UI.greSid=k; render(); break;
    case "greScope": UI.greScope=k; render(); break;
    case "grip": addGrip(+el.dataset.z,el.dataset.d); break;
    case "gripUndo": { const i=S.grips.map(g=>g.stationId).lastIndexOf(UI.greSid); if(i>=0) S.grips.splice(i,1); commit(); break; }
    case "gripClear": S.grips=S.grips.filter(g=>g.stationId!==UI.greSid); commit(); break;
    case "proSid": UI.proSid=k; render(); break;
    case "delW": S.wastes=S.wastes.filter(w=>w.id!==id); commit(); break;
    case "delR": S.runs=S.runs.filter(r=>r.id!==id); S.wastes.forEach(w=>{ if(w.runId===id) w.runId=null; }); commit(); break;
    case "addSt": { const n=S.stations.filter(s=>s.type===k).length+1; const s={id:uid(),name:`${k} ${n}`,worker:"",type:k,productId:null}; S.stations.push(s); S.spa[s.id]={w:10,h:6,landmarks:[],pts:[]}; commit(); break; }
    case "delSt": S.stations=S.stations.filter(s=>s.id!==id); S.runs=S.runs.filter(r=>r.stationId!==id); S.wastes=S.wastes.filter(w=>w.stationId!==id); S.grips=S.grips.filter(g=>g.stationId!==id); delete S.spa[id]; commit(); break;
    case "delT": S.wasteTypes=S.wasteTypes.filter(t=>t.id!==id); commit(); break;
    case "delP": S.products=S.products.filter(p=>p.id!==id); S.stations.forEach(s=>{ if(s.productId===id) s.productId=null; }); commit(); break;
    case "newT": openWasteTypeModal(null); break;
    case "newP": openProductModal(null,false); break;
    case "expX": expXLSX(); break;
    case "expJ": expJSON(); break;
    case "expP": expPDF(); break;
    case "resetData": S.runs=[];S.wastes=[];S.grips=[]; Object.values(S.spa).forEach(sp=>sp.pts=[]); commit(); toast("Messdaten gelöscht"); break;
    case "resetAll": S=freshState(); commit(); toast("Alles zurückgesetzt"); break;
    case "demo": loadDemo(); break;
  }
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="imp"&&el.files&&el.files[0]){ const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.stations) throw 0; S=normalize(d); commit(); toast("Sicherung eingelesen"); }catch(_){ toast("Datei ist keine gültige Sicherung"); } }; fr.readAsText(el.files[0]); el.value=""; return; }
  const c=el.dataset.chg; if(!c) return;
  const sid=el.dataset.sid, id=el.dataset.id, v=el.value;
  switch(c){
    case "prod": if(v==="__new"){ el.value=stById(sid).productId||""; openProductModal(sid,false); return; } stById(sid).productId=v||null; { const r=runOf(sid); if(r&&v) r.productId=v; } commit(); break;
    case "waste": if(!v) return; if(v==="__new"){ el.value=""; openWasteTypeModal(sid); return; } startWaste(sid,v); break;
    case "spaW": S.spa[UI.spaSid].w=Math.max(2,Math.min(60,+v||10)); commit(); break;
    case "spaH": S.spa[UI.spaSid].h=Math.max(2,Math.min(60,+v||6)); commit(); break;
    case "editType": { const w=S.wastes.find(x=>x.id===id); if(w){ w.typeId=v; commit(); } break; }
    case "editProd": { const r=S.runs.find(x=>x.id===id); if(r){ r.productId=v||null; commit(); } break; }
    case "stName": stById(id).name=v.trim()||stById(id).name; commit(); break;
    case "stWorker": stById(id).worker=v.trim(); commit(); break;
    case "stType": stById(id).type=v; commit(); break;
    case "tName": if(v.trim()){ typeById(id).name=v.trim(); } commit(); break;
    case "tMuda": typeById(id).muda=v; commit(); break;
    case "pName": if(v.trim()){ prodById(id).name=v.trim(); } commit(); break;
  }
});

  const t=now(); const d=new Date();
  $("#clock").textContent=`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
  document.querySelectorAll("[data-tick]").forEach(el=>{ const s=+el.dataset.tick; if(s) el.textContent=fmt(t-s); });
